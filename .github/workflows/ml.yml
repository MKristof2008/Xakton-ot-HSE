name: ML tests

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Тесты покрывают и ML, и API: API-тесты импортируют backend.main,
        # поэтому нужны зависимости обоих наборов. requirements-test.txt
        # подключает их одним файлом (ml + backend).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run ML tests
        # pytest-asyncio регистрирует маркер asyncio. Без него pytest выдаёт
        # предупреждения и может пропустить async-тесты в будущих версиях.
        run: |
          python -m pytest ml -q
